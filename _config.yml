title: Aman Institute
full_name: Aman Institute for Intellectual Security Studies
tagline: For Youth Intellectual Security
description: >-
  Aman Institute for Intellectual Security Studies is a 501(c)(3) nonprofit in
  Killeen, Texas that promotes the intellectual, spiritual, and mental safety of
  youth and offers solutions to the deviant thinking that leads to addiction,
  violence, extremism, and life failure.
lang: en-US

url: "https://amaninstitute.org"
baseurl: ""

contact:
  form_url: "https://forms.gle/FWoYjsNmsAnvHjGCA"

social:
  youtube: "https://www.youtube.com/@amaninstituteforyouthintel2142"

permalink: pretty

plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .github/
  - _config.ci.yml
  - src/
  - package.json
  - package-lock.json
  - node_modules/

defaults:
  - scope:
      path: ""
    values:
      layout: page
