<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand-logo" src="{{ '/assets/images/logo/aman-institute-logo-240.webp' | relative_url }}" alt="" width="56" height="56">
      <span class="brand-text">
        <span class="brand-name">Aman Institute</span>
        <span class="brand-tagline">{{ site.tagline }}</span>
      </span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <svg class="icon icon-open" aria-hidden="true"><use href="#i-menu"></use></svg>
      <svg class="icon icon-close" aria-hidden="true"><use href="#i-x"></use></svg>
      <span class="nav-toggle-label">Menu</span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul>
        {%- for item in site.data.navigation %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}{% if item.cta %} class="nav-cta"{% endif %}>{{ item.title }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
  </div>
</header>
