{%- comment -%} Decorative grid + soft brand-coloured glow. The parent needs `relative isolate overflow-hidden`. Param: id (unique per page). {%- endcomment -%}
<svg class="absolute inset-0 -z-10 size-full stroke-navy-900/10 [mask-image:radial-gradient(100%_100%_at_top_right,white,transparent)]" aria-hidden="true">
  <defs>
    <pattern id="{{ include.id }}" width="200" height="200" x="50%" y="-1" patternUnits="userSpaceOnUse">
      <path d="M.5 200V.5H200" fill="none"></path>
    </pattern>
  </defs>
  <rect width="100%" height="100%" stroke-width="0" fill="url(#{{ include.id }})"></rect>
</svg>
<div class="absolute top-0 left-[calc(50%-4rem)] -z-10 transform-gpu blur-3xl sm:left-[calc(50%-18rem)] lg:top-[calc(50%-30rem)] lg:left-48 xl:left-[calc(50%-24rem)]" aria-hidden="true">
  <div class="aspect-[1108/632] w-[69.25rem] bg-linear-to-r from-brand-sky to-leaf-400 opacity-25" style="clip-path: polygon(73.6% 51.7%, 91.7% 11.8%, 100% 46.4%, 97.4% 82.2%, 92.5% 84.9%, 75.7% 64%, 55.3% 47.5%, 46.5% 49.4%, 45% 62.9%, 50.3% 87.2%, 21.3% 64.1%, 0.1% 100%, 5.4% 51.1%, 21.4% 63.9%, 58.9% 0.2%, 73.6% 51.7%)"></div>
</div>
