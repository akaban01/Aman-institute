---
layout: default
---
<header class="page-hero">
  <div class="container page-hero-inner">
    {% if page.eyebrow %}<p class="eyebrow eyebrow-light">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.heading | default: page.title }}</h1>
    {% if page.intro %}<p class="lead">{{ page.intro }}</p>{% endif %}
  </div>
</header>
{{ content }}
